[project]
name = "kat-equity-swing"
version = "1.0.0"
description = "KAT — Indian equity (NSE) swing-trading system. HYDRA transformer+MoE neural network (one model per symbol), real Zerodha delivery cost model, backtest/paper/live trading, FastAPI dashboard."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    # Stable tensorflow has no wheel for Python >=3.14 yet - tf-nightly does.
    # On Python 3.11-3.13, prefer stable; on 3.14+, this falls back to nightly.
    "tensorflow>=2.21.0; python_version < '3.14'",
    "tf-nightly; python_version >= '3.14'",
    "keras",
    "pyyaml",
    "requests",
    "python-dotenv",
    "kiteconnect",           # Zerodha broker adapter (exchange/brokers/zerodha_broker.py)
    "fastapi",                # dashboard API (api/swing_dashboard/main.py)
    "uvicorn",                 # ASGI server to run the dashboard
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
