[project]
name = "iron-oracle-kat"
version = "12.5.0"
description = "Iron Oracle / KAT — GPT-style crypto trading model (Hydra architecture) with live trading, backtesting, and a prediction dashboard."
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "tensorflow==2.21.0",
    "keras==3.13.2",
    "pandas-ta==0.4.71b0",
    "matplotlib==3.10.8",
    "requests==2.32.5",
    "python-dotenv==1.2.2",
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "plotly==6.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==6.2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
