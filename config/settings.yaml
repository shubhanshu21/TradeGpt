# Central configuration. No secrets here - those go in .env.
#
# Trading logic here is the trained neural network (src/strategies/swing/
# ml_strategy.py) only - no rule-based strategies. This config governs the
# broker/backtest/paper/live infrastructure the model plugs into; the
# model's own training config (context window, universe, cost approximation
# for labels) lives in src/config/sovereign_config.py, which reads several
# values (universe.symbols, swing.*) from THIS file so there's one source
# of truth, not two that can drift out of sync.

mode: backtest   # backtest | paper | live

broker:
  name: upstox     # zerodha | upstox | dhan | csv - switching is config-only, see src/exchange/brokers/
                   # csv = backtest-only, reads cache/kaggle/<SYMBOL>.csv (see src/data/import_kaggle_data.py)
                   #       no live prices/orders - switch to a real broker for paper trading

universe:
  # Pivoted to index-only (was the 38-stock Nifty-50 large-cap universe -
  # see git history for that list). Index-level direction prediction has a
  # real structural advantage individual-stock prediction doesn't: company-
  # specific noise cancels out across the index's 50 constituents, leaving
  # a smoother, more learnable market-wide signal - confirmed directly this
  # session (individual-stock fine-tunes landed 44.8%-56.1%, matching
  # published walk-forward research for single stocks, while index-level
  # prediction is the more tractable target going forward).
  # NIFTYBEES (not "NIFTY") on purpose: fetch_historical.py's
  # benchmark_symbols list hardcodes NIFTY (and INDIA VIX) as excluded from
  # the tradeable data dict regardless of what's in this list, specifically
  # so the rel_strength_20d benchmark reference can never accidentally be
  # treated as a real position - putting "NIFTY" here would silently
  # backtest/paper/live against an empty universe. NIFTYBEES is a real,
  # separate NSE-listed ETF (trades like any stock through the existing
  # broker/backtest/paper/live pipeline, no new code needed) that tracks
  # the index closely - confirmed real cached data 2002-2025, 5,959 days.
  # Nifty futures/options would track the same index even more directly
  # but need new broker/margin/expiry/lot-size handling not yet built.
  symbols:
    - NIFTYBEES

training:
  # Which symbols an actual `python3 train.py` run pools together. Separate
  # from universe.symbols (which is the full tradeable universe backtest/
  # paper/live pull data for). null/omitted = use the full universe.symbols
  # list - with universe.symbols now just NIFTYBEES, this mirrors it.
  symbols:
    - NIFTYBEES

swing:
  # Positional/swing trading: daily candles, multi-day holds, no same-day
  # square-off. This is the mode actually built end-to-end (data, model,
  # backtest, paper, live) - see intraday: below for the reserved config
  # slot of the not-yet-built next mode.
  interval: "day"             # canonical interval string, see src/exchange/brokers/base.py
  start_date: "1990-01-01"   # deliberately before NSE's earliest electronic
                              # trading records - the broker returns whatever
                              # actually exists per symbol (confirmed RELIANCE
                              # goes back to 2000-01-03), so this maximizes real
                              # per-stock history instead of guessing a cutoff
  end_date: "2025-12-31"
  initial_capital: 200000
  capital_per_trade: 20000
  max_concurrent_positions: 5
  max_holding_days: 20        # force-exit if neither stop nor target hit within N trading days
  hard_stop_loss_pct: 0.05    # swing needs more room to breathe than intraday would
  hard_target_pct: 0.10
  max_total_loss_pct: 0.10    # live only: cumulative realized loss kill switch, % of initial_capital
  costs:
    # Zerodha DELIVERY (CNC) charges - zero brokerage but STT on both legs
    # and a per-sell DP charge; see src/backtest/delivery_costs.py docstring.
    stt_pct: 0.001              # 0.1% - both buy AND sell for delivery
    exchange_txn_pct: 0.0000297
    sebi_pct: 0.0000010
    stamp_duty_buy_pct: 0.00015  # buy side only, delivery rate
    dp_charge_flat: 15.93        # ~Rs 13.5 + 18% GST, charged per sell, per scrip, per day
    gst_pct: 0.18

# Reserved for the intraday mode requested alongside swing - broker/resample
# layers already support "60minute" (src/exchange/resample.py,
# src/exchange/brokers/*), but no intraday data/train/backtest/paper/live
# pipeline has been built yet (swing is being built and validated first).
# These values are placeholders to be wired up when that work starts, not
# read by any code today.
intraday:
  interval: "60minute"
  start_date: "2023-01-01"    # brokers only retain ~a few years of minute-level history
  end_date: "2025-12-31"
  initial_capital: 200000
  capital_per_trade: 20000
  max_concurrent_positions: 5
  max_holding_bars: 6         # force square-off within N 60-minute bars (same trading day)
  hard_stop_loss_pct: 0.01
  hard_target_pct: 0.02
  square_off_time: "15:15"    # IST - MIS positions must close before exchange auto-square-off
  costs:
    # Zerodha INTRADAY (MIS) charges differ from delivery: brokerage applies
    # (unlike CNC), STT only on the sell leg, no DP charge. Not yet used by
    # any code - src/backtest/delivery_costs.py only implements delivery
    # costs today.
    brokerage_pct: 0.0003       # 0.03% or Rs 20/order, whichever is lower (approximated as pct here)
    brokerage_flat_cap: 20.0
    stt_pct: 0.00025            # 0.025% - sell side only, intraday
    exchange_txn_pct: 0.0000297
    sebi_pct: 0.0000010
    stamp_duty_buy_pct: 0.00003 # buy side only, intraday rate (lower than delivery)
    gst_pct: 0.18

paper_trading:
  swing_log_file: "logs/swing_paper_trades.csv"

live_trading:
  enabled: false             # must be manually flipped to true - safety gate
  confirm_each_order: true
  log_file: "logs/swing_live_trades.csv"
  product: "CNC"             # equity delivery product (not intraday MIS)
  use_broker_stop_loss: true # attempt a broker-side GTT/OCO after entry (Zerodha only for now -
                             # see src/exchange/brokers/zerodha_broker.py:place_gtt_oco); always ALSO
                             # falls back to this process polling regardless of broker support
